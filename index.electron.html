<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/game.css">

    <title>Las ruinas del Brezal</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            background: #172b27;
        }

        #juego {
            display: grid;
            width: 100vw;

            place-items: center;
        }

        canvas {
            display: block;
            max-width: 100vw;
            max-height: 100vh;
            aspect-ratio: 3 / 2;
        }
    </style>
</head>

<body>
    <div id="juego"></div>
    <script src="./src/main.ts" type="module"></script>

</body>

</html>
